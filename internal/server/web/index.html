<!DOCTYPE html>
<html lang="en" data-motion="off" data-boot="off">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef1f6">
  <title>FireWifi</title>
  <link rel="stylesheet" href="/assets/dashboard.min.css">
</head>
<body>
  <div class="app-shell">
    <nav class="app-rail" id="app-rail" aria-label="Main navigation"></nav>
    <div class="app-body">
      <header class="topbar">
        <div class="brand">
          <h1>FireWifi</h1>
          <p>Pi hotspot</p>
        </div>
        <div class="live"><span id="live-dot" class="pulse"></span><span id="live-text">Connecting</span></div>
      </header>
      <main id="app" class="app-content"></main>
    </div>
  </div>
  <div id="drawer-root" hidden></div>
  <div id="modal-root"></div>
  <div id="toast" class="toast"></div>
  <script id="initial-state" type="application/json">__STATE__</script>
  <script src="/assets/js/app.js" defer></script>
</body>
</html>
